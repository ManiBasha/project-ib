<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>India Bay Admin</title>
<link rel="icon" type="image/png" href="../assets/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Martel+Sans:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#15112a;--panel:#1f1938;--panel2:#2a2250;--ink:#f3eefc;--muted:#b6adcc;--edge:#3a3060;--acc:#ffc93c;--ok:#3ddc97;--bad:#ff7a7a}
:root[data-theme="light"]{--bg:#f6f1e7;--panel:#fffdf8;--panel2:#f3ecdf;--ink:#1f1a33;--muted:#5d5670;--edge:#e0d6c3;--acc:#c2410c;--ok:#13804f;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Martel Sans",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font:800 22px "Baloo 2",sans-serif}.brand small{font:600 13px "Martel Sans",sans-serif;color:var(--muted);margin-left:6px}
.who{color:var(--muted);font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,.btn{font:700 14px "Baloo 2",sans-serif;border-radius:10px;border:1px solid var(--edge);background:var(--panel2);color:var(--ink);padding:7px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:transparent;color:#1f1a33}button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
nav button{white-space:nowrap}nav button[aria-selected="true"]{background:var(--acc);color:#1f1a33;border-color:transparent}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font:800 20px "Baloo 2",sans-serif;margin:0 0 4px}h3{font:800 16px "Baloo 2",sans-serif;margin:0 0 10px}
.note{color:var(--muted);font-size:13.5px;margin:0 0 10px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
input,select,textarea{font:14px "Martel Sans",sans-serif;color:var(--ink);background:var(--panel2);border:1px solid var(--edge);border-radius:9px;padding:7px 9px;width:100%;min-width:0}
input[type=checkbox]{width:18px;height:18px}input[type=color]{padding:2px;height:36px}
textarea{min-height:70px;resize:vertical}
details{border-top:1px solid var(--edge);padding:10px 0}details:first-of-type{border-top:0}
summary{font:800 16px "Baloo 2",sans-serif;cursor:pointer;list-style-position:outside}
.list .lrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-items:end;background:var(--panel2);border-radius:12px;padding:10px;margin:0 0 8px}
.list .lrow .del{justify-self:end}.list .lrow label:first-child{grid-column:span 2}@media (max-width:420px){.list .lrow label:first-child{grid-column:1/-1}}
.bar{position:sticky;bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:10px 14px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;vertical-align:top;padding:8px 6px;border-top:1px solid var(--edge)}th{color:var(--muted);font-weight:600;font-size:12.5px}
td.msg{white-space:pre-wrap;word-break:break-word;max-width:360px}
.tw{overflow-x:auto}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--panel2);border-radius:12px;padding:10px 14px;min-width:120px}.stat b{display:block;font:800 22px "Baloo 2",sans-serif}
.center{max-width:460px;margin:12vh auto;text-align:center}
code,pre{font-size:12.5px;background:var(--panel2);border-radius:8px;padding:2px 6px}pre{padding:10px;text-align:left;white-space:pre-wrap}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--panel2)}
[hidden]{display:none!important}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 14px}.dbar{display:block;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--acc),#ff5fa2);width:var(--w)}
nav.sub{margin-top:-4px}label.wide{grid-column:1/-1}.list .lrow label.wide textarea{min-height:120px}.pill.bad{background:var(--bad);color:#fff}
.msl{position:relative}.ms summary{cursor:pointer;border:1px solid var(--edge,#3a3354);border-radius:10px;padding:8px 10px;margin-top:4px;background:var(--panel2,#2a2350);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;list-style:none}.ms[open] .msbox{position:absolute;z-index:5;left:0;right:0;max-height:260px;overflow:auto;background:var(--panel,#211a3a);border:1px solid var(--edge,#3a3354);border-radius:10px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.ms .ck{display:flex;gap:6px;margin:4px 0;font-weight:400}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand"><img src="../assets/logo-192.png" alt="" style="width:30px;height:30px;border-radius:7px;vertical-align:-8px;margin-right:8px">India Bay <small>Admin</small></div><div class="who" id="who"></div></header>
  <div id="gate" class="card center"><p>Loading…</p></div>
  <div id="app" hidden>
    <nav role="tablist" id="tabs"></nav>
    <section id="pane"></section>
  </div>
</div>
<script src="../js/site-config.js"></script>
<script src="../js/online-config.js"></script>
<script src="../js/config.js?v=2.01.00"></script>
<script src="../js/world-west.js"></script>
<script src="../js/world-southwest.js"></script>
<script src="../js/world-southeast.js"></script>
<script src="../js/world-north.js"></script>
<script src="../js/world-east.js"></script>
<script src="../js/prices.js?v=2.01.00"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(function () {
  const C = window.ONLINE || {}, K = window.IBCONF, W = window.WORLD;
  const $ = q => document.querySelector(q), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const gate = $('#gate');
  if (!C.supabaseUrl || !window.supabase) { gate.innerHTML = '<h2>Online settings missing</h2><p class="note">Fill in js/online-config.js first.</p>'; return; }
  const sb = supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' } });
  const here = location.origin + location.pathname;
  let session = null, cfg = null;

  async function start() {
    const { data } = await sb.auth.getSession(); session = data.session;
    if (location.search) history.replaceState(null, '', location.pathname);
    if (!session || session.user.is_anonymous) return signIn(session && session.user.is_anonymous);
    $('#who').innerHTML = `${esc(session.user.email || '')} <button id="out">Log out</button>`;
    $('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
    const ad = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
    if (!ad.data) return notAdmin();
    gate.hidden = true; $('#app').hidden = false; tabs();
  }
  function signIn(guest) {
    gate.innerHTML = `<h2>Admin sign-in</h2><p class="note">${guest ? 'You are signed in as a guest. Admins sign in with email or Google.' : 'Only India Bay admins can open this page.'}</p>
      <form id="em" novalidate style="display:flex;gap:8px;margin:12px 0"><input type="email" id="ea" placeholder="you@gmail.com" autocomplete="email" required><button class="pri" type="submit">Email me a link</button></form>
      <p><button id="g">Sign in with Google</button></p><p class="note" id="gm" aria-live="polite"></p>`;
    const gm = $('#gm');
    $('#em').onsubmit = async e => { e.preventDefault(); const email = $('#ea').value.trim(); if (!/^\S+@\S+\.\S+$/.test(email)) { gm.textContent = 'Type your email address.'; gm.className = 'note bad'; return; }
      if (guest) await sb.auth.signOut(); gm.textContent = 'Sending…'; gm.className = 'note';
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: here, shouldCreateUser: true } });
      if (error) { gm.textContent = /rate limit/i.test(error.message) ? 'Too many emails sent. Wait an hour and try again.' : error.message; gm.className = 'note bad'; return; }
      gm.textContent = `Check ${email} (and spam) for a sign-in link from Supabase, then open it on this device.`; gm.className = 'note ok'; };
    $('#g').onclick = async () => { if (guest) await sb.auth.signOut(); const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: here } }); if (error) { gm.textContent = error.message; gm.className = 'note bad'; } };
    sb.auth.getSession && fetch(C.supabaseUrl.replace(/\/$/, '') + '/auth/v1/settings', { headers: { apikey: C.supabaseKey } }).then(r => r.json()).then(j => { if (!(j.external && j.external.google)) $('#g').hidden = true; }).catch(() => {});
  }
  function notAdmin() {
    const email = session.user.email || 'your-email@gmail.com';
    gate.innerHTML = `<h2>Not an admin</h2><p class="note">${esc(email)} doesn't have admin access yet. To give it, run this in Supabase → SQL Editor:</p><pre>insert into public.admins (user_id)\nselect id from auth.users where email = '${esc(email)}'\non conflict do nothing;</pre><p class="note">Then reload this page.</p>`;
  }

  /* ---------- tabs ---------- */
  const TABS = [['dash', '📊 Dashboards'], ['settings', 'Game settings'], ['prices', 'Time and prices'], ['ads', 'Billboards and ads'], ['fest', 'Festivals, events and gifts'], ['reports', 'Reports'], ['safety', 'Bans and silences'], ['sugg', 'Messages to admin'], ['support', 'Support'], ['players', 'Players'], ['testers', 'Testers'], ['admins', 'Admins'], ['refresh', '🔄 Refresh']];
  let cur = 'dash';
  function tabs() {
    $('#tabs').innerHTML = TABS.map(([id, l]) => `<button role="tab" data-t="${id}" aria-selected="${id === cur}">${l}</button>`).join('');
    $('#tabs').onclick = e => { const t = e.target.dataset.t; if (t) { cur = t; tabs(); } };
    clearInterval(tabs.iv); ({ dash: dashTab, settings: settingsTab, prices: pricesTab, ads: () => listTab('billboards'), fest: () => listTab('festivals', 'events', 'gifts'), reports: reportsTab, safety: safetyTab, support: supportTab, sugg: suggTab, players: playersTab, testers: testersTab, admins: adminsTab, refresh: refreshTab })[cur]();
  }
  async function loadCfg() { if (cfg) return cfg; const { data, error } = await sb.from('game_config').select('data').eq('id', 1).maybeSingle(); if (error) throw error; cfg = K.mergeCfg(K.DEFAULTS, data && data.data); return cfg; }
  async function saveCfg(msgEl) {
    msgEl.textContent = 'Saving…'; msgEl.className = 'note';
    cfg.name = String(cfg.name || '').trim() || K.DEFAULTS.name;
    const { error } = await sb.from('game_config').upsert({ id: 1, data: cfg, updated_at: new Date().toISOString() });
    if (error) { msgEl.textContent = 'Could not save: ' + error.message; msgEl.className = 'note bad'; return; }
    msgEl.textContent = 'Saved. Players get the new settings when they load the game, or within a minute.'; msgEl.className = 'note ok';
  }
  const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  function set(o, p, v) { const k = p.split('.'); let a = o; for (let i = 0; i < k.length - 1; i++) a = a[k[i]]; a[k[k.length - 1]] = v; }

  /* ---------- settings form ---------- */
  const ACT = { sleep: 'Full sleep', meal: 'Meal', snack: 'Snack', drink: 'Drink', cook: 'Cooking', tv: 'TV cricket' };
  const QUE = { petrol: 'Petrol pump', cng: 'CNG pump', atm: 'ATM', ticket: 'Railway ticket counter', hospital: 'Hospital', checkin: 'Airport check-in' };
  const TRV = { sleeper: 'Train sleeper', ac: 'Train AC', flight: 'Flight', bus: 'State bus', busac: 'AC sleeper bus', citybus: 'City bus', tour: 'City tour bus', bottaxi: 'Bot taxi', ferry: 'Ferry', local: 'Mumbai local', metro: 'Metro', bullet: 'Bullet train', baytaxi: 'BayTaxi (fare is per km; this sets the longest trip)' };
  const CHL = { signal: 'Red light', licence: 'No licence', helmet: 'No helmet', puc: 'No PUC', insurance: 'No insurance', speeding: 'Speeding', queue: 'Queue jumping' };
  const num = (p, l, min, max, step) => `<label>${l}<input type="number" data-p="${p}" min="${min}" max="${max}" step="${step || 1}"></label>`;
  const txt = (p, l, max) => `<label>${l}<input type="text" data-p="${p}" maxlength="${max}"></label>`;
  const vnum = (p, l, d) => `<label>${esc(l)}<input type="number" data-p="${p}" min="0" max="400" step="1" placeholder="${d} km/h"></label>`;
  const ck = (p, l) => `<label class="ck"><input type="checkbox" data-p="${p}" data-b="1"> ${l}</label>`;
  const sel = (p, l, opts) => `<label>${l}<select data-p="${p}">${opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`;
  async function settingsTab() {
    const c = await loadCfg(); c.vspeed = c.vspeed || {}; for (const [t] of (window.IB_VEHS || [])) c.vspeed[t] = c.vspeed[t] || {};
    const S = [
      ['Announcements', `<label style="grid-column:1/-1">Announcement on the start screen<textarea data-p="announce" maxlength="240" placeholder="Diwali update: double fares this week"></textarea></label>`],
      ['Weather', sel('weather', 'Weather', [['auto', 'Follows the season'], ['clear', 'Always clear'], ['cloudy', 'Cloudy'], ['rain', 'Rain'], ['monsoon', 'Monsoon storm'], ['fog', 'Fog']])],
      ['Needs and activity times', ck('needs', 'Hunger and sleep needs') + num('foodHrs', 'Food lasts (game hours)', 2, 48) + num('awakeHrs', 'Awake before exhausted (game hours)', 4, 48) + Object.keys(ACT).map(k => num('act.' + k, ACT[k] + ' (game minutes)', 1, 720)).join('')],
      ['Queues (real seconds per person)', Object.keys(QUE).map(k => num('queue.' + k, QUE[k], 1, 300)).join('')],
      ['Travel tickets and times', Object.keys(TRV).map(k => num('travel.' + k + '.0', TRV[k] + ' ticket (₹)', 0, 100000, 10) + num('travel.' + k + '.1', TRV[k] + ' longest trip (s)', 5, 1800, 5)).join('')],
      ['Streets and police', num('traffic', 'Traffic vehicles near the player', 0, 60) + num('peds', 'Pedestrians near the player', 0, 80) + sel('police', 'Police', [['off', 'Off'], ['easy', 'Easy'], ['normal', 'Normal'], ['hard', 'Hard']]) + ck('weapons', 'Weapons and bank robbery')],
      ['Vehicle speeds', num('botSpeedPct', 'Street traffic speed (% of normal)', 30, 300, 5) + num('playerSpeedPct', 'Player vehicles speed (% of normal)', 30, 300, 5) + '<p class="note" style="grid-column:1/-1;margin:0">Top speed for each vehicle in km/h. Leave a box empty or at 0 to keep the normal speed shown in grey. Traffic is the street bots; players is anyone driving it.</p>' + (window.IB_VEHS || []).map(([t, l, d]) => vnum('vspeed.' + t + '.b', l + ' · traffic', d) + vnum('vspeed.' + t + '.p', l + ' · players', d)).join('')],
      ['Online and moderation', ck('voiceChat', 'Voice messages between players (turn off if there is trouble; takes effect within a minute for everyone)') + ck('baygramOn', 'BayGram feed: players post photos and clips taken in the game (turn off to pause the feed and posting)') + ck('challansOn', 'Traffic challans: red lights, speed cameras, riding without a helmet') + ck('filmOn', 'Film mode for every player: cinematic cameras and video recording (Profile → Film mode)') + ck('chatOn', 'Chat between players: nearby chat, BayGram messages and comments') + ck('callsOn', 'Phone calls between players') + `<label style="grid-column:1/-1">Announcement when chat or calls are off<input type="text" data-p="chatNote" maxlength="200" placeholder="Chat is paused for maintenance until 6 pm"></label>`],
      ['Heroes', ck('heroes.vidyut', '⚡ Vidyut, the Lightning Guardian (Kerala)') + ck('heroes.varsha', '🌧 Varsha, the Monsoon Guardian (Maharashtra)') + ck('heroes.marudhar', '🦅 Marudhar, the Desert Falcon (Rajasthan)') + ck('heroes.patang', '🪁 Patang, the Kite Ace (Gujarat)') + ck('heroes.sagar', '🌊 Sagar, the Tide Rider (Goa)') + ck('heroes.chandan', '🌿 Chandan, the Forest Spirit (Karnataka)') + `<p class="note" style="grid-column:1/-1;margin:0">Each hero shows in one city of its state at a time and moves every 20 minutes. Switch one off to hide it from every player.</p>`],
      ['States', `<p class="note" style="grid-column:1/-1;margin:0">Untick a state to close it for every player: it cannot be picked on the start screen and no trips are sold to it. Players already there can still drive out.</p>` + [...new Set(W.zones.map(z => z.st))].map(st => `<label class="ck"><input type="checkbox" data-p="states.${st}" data-b="1" data-inv="0"> ${esc(W.states[st] || st)}</label>`).join('')]
    ];
    $('#pane').innerHTML = `<div class="card"><h2>Game settings</h2><p class="note">These apply to every player.</p><form id="f" novalidate>${S.map(([t, h], i) => `<details${i === 0 ? ' open' : ''}><summary>${t}</summary><div class="grid" style="margin-top:10px">${h}</div></details>`).join('')}
      <details><summary>News and announcements</summary><p class="note">Each item shows between its dates on the start screen ticker and in Phone → BayRadio.</p><div id="l_news"></div></details><details><summary>Changelog</summary><p class="note">Every version is listed. Edit any text, or set <b>Players see it</b> to Hide. Write each note on its own line. A new entry with a higher version shows players a What's new pop-up once.</p><div id="l_changelog"></div></details></form>
      <div class="bar"><button class="pri" id="save">Save for all players</button><button id="reset" class="danger">Reset to defaults</button><span class="note" id="msg" style="margin:0"></span></div></div>`;
    const f = $('#f');
    c.states = c.states || {};
    f.querySelectorAll('[data-p]').forEach(el => { const v = get(c, el.dataset.p); if (el.dataset.p.startsWith('states.')) el.checked = v !== false; else if (el.dataset.b) el.checked = !!v; else if (v != null) el.value = v; });
    c.changelog = K.fullChangelog(c.changelog); listEditor($('#l_news'), 'news'); listEditor($('#l_changelog'), 'changelog');
    f.addEventListener('input', e => { const el = e.target; if (!el.dataset.p) return; let v = el.dataset.b ? el.checked : el.type === 'number' ? Math.min(+el.max || 1e9, Math.max(+el.min || -1e9, +el.value || 0)) : el.value; if (el.dataset.p === 'theme') { f.querySelector('[data-p=accent]').value = K.THEMES[el.value].accent; set(c, 'accent', K.THEMES[el.value].accent); } set(c, el.dataset.p, v); });
    $('#save').onclick = () => saveCfg($('#msg'));
    $('#reset').onclick = () => { if (!confirm('Reset every setting to the defaults? You still need to press Save.')) return; cfg = JSON.parse(JSON.stringify(K.DEFAULTS)); settingsTab(); };
  }
  /* ---------- time and prices ---------- */
  async function pricesTab() {
    const c = await loadCfg(); c.prices = c.prices || {}; const PR = window.PRICES || { groups: [] };
    const top = [
      ['Bay clock', num('timeSpeed', 'Time speed (game minutes per real second)', 0, 10, .5) + num('timeOffset', 'Clock shift (game minutes)', -1440, 1440, 10) + '<p class="note" style="grid-column:1/-1;margin:0">1 means one game minute passes every real second, so a game day lasts 24 real minutes. 0 stops the clock.</p>'],
      ['Money', num('priceMul', 'All prices × (multiplies every price below)', .5, 3, .1) + num('fareMul', 'Job pay ×', .5, 3, .1) + num('startCash', 'Starting cash (₹)', 0, 10000000, 100) + num('fuel.petrol', 'Petrol ₹/L', 10, 500) + num('fuel.diesel', 'Diesel ₹/L', 10, 500) + num('fuel.cng', 'CNG ₹/kg', 10, 500) + num('toll', 'Toll (₹)', 0, 5000, 10)],
      ['Travel tickets and times', Object.keys(TRV).map(k => num('travel.' + k + '.0', TRV[k] + ' ticket (₹)', 0, 100000, 10) + num('travel.' + k + '.1', TRV[k] + ' longest trip (s)', 5, 1800, 5)).join('')]];
    const changed = g => g[1].filter(([k]) => c.prices[k] != null && c.prices[k] !== '').length;
    $('#pane').innerHTML = `<div class="card"><h2>Time and prices</h2><p class="note">Change the game clock and what everything costs. Leave a price empty to use the default shown in grey.</p><form id="f" novalidate>` +
      top.map(([t, h], i) => `<details${i < 2 ? ' open' : ''}><summary>${t}</summary><div class="grid" style="margin-top:10px">${h}</div></details>`).join('') +
      `<h3 style="margin:18px 0 6px">Item prices (₹)</h3><input type="search" id="pq" placeholder="Search items, e.g. dosa, helmet, SUV" style="width:100%;margin:0 0 8px">` +
      PR.groups.map(g => `<details class="pg"><summary>${esc(g[0])} <span class="note" style="margin:0">· ${g[1].length} items${changed(g) ? ' · ' + changed(g) + ' changed' : ''}</span></summary><div class="grid" style="margin-top:10px">${g[1].map(([k, l, d]) => `<label data-n="${esc((g[0] + ' ' + l).toLowerCase())}">${esc(l)}<input type="number" min="0" step="1" data-pk="${esc(k)}" placeholder="${d}" value="${c.prices[k] != null ? esc(c.prices[k]) : ''}"></label>`).join('')}</div></details>`).join('') +
      `</form><div class="bar"><button class="pri" id="save">Save for all players</button><button id="preset" class="danger">Clear changed prices</button><span class="note" id="msg" style="margin:0"></span></div></div>`;
    const f = $('#f');
    f.querySelectorAll('[data-p]').forEach(el => { const v = get(c, el.dataset.p); if (v != null) el.value = v; });
    f.addEventListener('input', e => { const el = e.target;
      if (el.dataset.pk) { const v = el.value.trim(); if (v === '') delete c.prices[el.dataset.pk]; else c.prices[el.dataset.pk] = Math.max(0, Math.round(+v || 0)); return; }
      if (el.id === 'pq') { const q = el.value.trim().toLowerCase(); f.querySelectorAll('.pg').forEach(d => { let any = false; d.querySelectorAll('label[data-n]').forEach(lb => { const ok = !q || lb.dataset.n.includes(q); lb.hidden = !ok; any = any || ok; }); d.hidden = !any; if (q) d.open = any; }); return; }
      if (!el.dataset.p) return; set(c, el.dataset.p, Math.min(+el.max || 1e9, Math.max(+el.min || -1e9, +el.value || 0))); });
    $('#save').onclick = () => saveCfg($('#msg'));

    ({ live: dashLive, usage: dashUsage, ads: dashAds })[dashSub](); }
  const tally = (L, f) => { const m = new Map(); for (const r of L) { const k = f(r) || '–'; m.set(k, (m.get(k) || 0) + 1); } return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const bars = (rows, total) => rows.length ? `<table>${rows.map(([k, n]) => `<tr><td>${esc(k)}</td><td style="width:55%"><span class="dbar" style="--w:${Math.max(2, Math.round(n / Math.max(1, total) * 100))}%"></span></td><td><b>${n}</b></td></tr>`).join('')}</table>` : '<p class="note">Nobody.</p>';
  let liveF = { state: 'all', zone: 'all', sex: 'all', acct: 'all', age: 'all' };
  async function dashLive() {
    const draw = async () => { if (cur !== 'dash' || dashSub !== 'live') return; const since = new Date(Date.now() - 150000).toISOString();
      const { data, error } = await sb.from('presence').select('username,is_guest,female,age_group,state,zone,x,z,mode,updated_at').gt('updated_at', since).limit(2000);
      if (error) { $('#dp').innerHTML = `<p class="note bad">${esc(error.message)} · run supabase-update-9.sql</p>`; return; }
      let srvN = '–'; try { const r = await fetch(String(C.serverUrl).replace(/\/$/, '') + '/status'); srvN = (await r.json()).west; } catch (e) {}
      const all = data || []; const L = all.filter(r => (liveF.state === 'all' || r.state === liveF.state) && (liveF.zone === 'all' || r.zone === liveF.zone) && (liveF.sex === 'all' || (liveF.sex === 'f' ? r.female : !r.female)) && (liveF.acct === 'all' || (liveF.acct === 'guest' ? r.is_guest : !r.is_guest)) && (liveF.age === 'all' || r.age_group === liveF.age));
      const opt = (k, list, lab) => `<label>${lab}<select data-f="${k}"><option value="all">All</option>${list.map(([v, t]) => `<option value="${esc(v)}"${liveF[k] === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
      const states = [...new Set(all.map(r => r.state).filter(Boolean))].map(s2 => [s2, W.states[s2] || s2]), zones = [...new Set(all.filter(r => liveF.state === 'all' || r.state === liveF.state).map(r => r.zone).filter(Boolean))].sort().map(z => [z, z]);
      $('#dp').innerHTML = `<div class="card"><div class="stats"><div class="stat"><b>${L.length}</b>playing now${L.length !== all.length ? ' (filtered)' : ''}</div><div class="stat"><b>${srvN ?? "–"}</b>on the game server</div><div class="stat"><b>${L.filter(r => r.female).length}</b>female look</div><div class="stat"><b>${L.filter(r => !r.female).length}</b>male look</div><div class="stat"><b>${L.filter(r => r.is_guest).length}</b>guests</div></div>
        <div class="grid" style="margin-top:12px">${opt('state', states, 'State')}${opt('zone', zones, 'City or town')}${opt('sex', [['m', 'Male'], ['f', 'Female']], 'Look (male / female)')}${opt('acct', [['google', 'Google'], ['guest', 'Guest']], 'Account')}${opt('age', ['under 13', '13-17', '18-24', '25-34', '35-49', '50+'].map(a => [a, a]), 'Age group')}</div>
        <p class="note" style="margin-top:8px">Players signed in and playing in the last 2 minutes. Updates every 15 seconds. Use these to choose where, and to whom, ads are shown.</p></div>
        <div class="card"><h3>Where they are</h3><canvas id="lmap" width="640" height="420" style="width:100%;max-width:640px;background:#123049;border-radius:12px"></canvas></div>
        <div class="grid2"><div class="card"><h3>By state</h3>${bars(tally(L, r => W.states[r.state] || r.state), L.length)}</div><div class="card"><h3>By city or town</h3>${bars(tally(L, r => r.zone).slice(0, 15), L.length)}</div><div class="card"><h3>Doing</h3>${bars(tally(L, r => ({ foot: 'Walking', drive: 'Driving', transit: 'Public transport', sleep: 'Sleeping', inside: 'Indoors' })[r.mode] || r.mode), L.length)}</div><div class="card"><h3>Age group</h3>${bars(tally(L, r => r.age_group || 'not given'), L.length)}</div></div>
        <div class="card"><h3>Players</h3><div class="tw"><table><tr><th>Username</th><th>Where</th><th>Doing</th><th>Look</th><th>Age</th><th>Account</th></tr>${L.slice(0, 200).map(r => `<tr><td>${esc(r.username)}</td><td>${esc(r.zone || '')}${r.state ? ' · ' + esc(W.states[r.state] || r.state) : ''}</td><td>${esc(r.mode)}</td><td>${r.female ? 'Female' : 'Male'}</td><td>${esc(r.age_group || '')}</td><td>${r.is_guest ? 'Guest' : 'Google'}</td></tr>`).join('')}</table></div></div>`;
      $('#dp').onchange = e => { const k = e.target.dataset.f; if (!k) return; liveF[k] = e.target.value; if (k === 'state') liveF.zone = 'all'; draw(); };
      const cv = $('#lmap'); if (cv) { const x = cv.getContext('2d'); const Z0 = W.Z0 || 0, sx = 640 / W.W, sz = 420 / (W.H - Z0), s0 = Math.min(sx, sz); x.fillStyle = '#123049'; x.fillRect(0, 0, 640, 420); x.fillStyle = 'rgba(255,244,226,.35)'; for (const z of W.zones) x.fillRect(z.x0 * s0, (z.z0 - Z0) * s0, Math.max(2, z.nx * 80 * s0), Math.max(2, z.nz * 80 * s0));
        for (const r of L) { if (r.x == null) continue; x.fillStyle = r.female ? '#ff5fa2' : '#5fb4ff'; x.beginPath(); x.arc(r.x * s0, (r.z - Z0) * s0, 4, 0, 6.29); x.fill(); } } };
    await draw(); tabs.iv = setInterval(draw, 15000); }
  async function dashUsage() {
    const since = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
    const { data, error } = await sb.from('usage_daily').select('day,metric,n').gte('day', since).order('day', { ascending: false });
    let cf = null; try { cf = await (await fetch(String(C.serverUrl).replace(/\/$/, '') + '/stats')).json(); } catch (e) {}
    if (error) { $('#dp').innerHTML = `<p class="note bad">${esc(error.message)} · run supabase-update-9.sql</p>`; return; }
    const days = [...new Set(data.map(r => r.day))].sort().reverse().slice(0, 7); const get = (d, m) => (data.find(r => r.day === d && r.metric === m) || {}).n || 0;
    const ROWS = [['Time', [['play_min', 'Minutes played'], ['drive_min', 'Driving (min)'], ['walk_min', 'Walking (min)'], ['transit_min', 'Public transport (min)'], ['sleep_min', 'Sleeping (min)'], ['inside_min', 'Indoors (min)'], ['animal_min', 'Animal rides (min)'], ['idle_min', 'Standing still (min)']]],
      ['Talking', [['voice_s', 'Voice chat (seconds talked)'], ['voice_talks', 'Times someone talked'], ['chat', 'Nearby chat messages'], ['texts', 'Texts'], ['group_texts', 'Group messages'], ['calls', 'Calls answered'], ['group_calls', 'Group calls started']]],
      ['Doing', [['tickets', 'Tickets booked'], ['taxis', 'BayTaxi rides'], ['posts', 'BayGram posts'], ['comments', 'Comments'], ['meals', 'Meals'], ['sleeps', 'Full sleeps'], ['events', 'Events hosted'], ['jumps', 'Jumps']]],
      ['Requests from the games', [['ws_out', 'Game server: messages sent (Cloudflare)'], ['ws_in', 'Game server: messages received (Cloudflare)'], ['sb_rest', 'Database reads and writes (Supabase)'], ['sb_rpc', 'Database functions (Supabase)'], ['sb_auth', 'Sign-in checks (Supabase)'], ['sb_storage', 'Photo uploads and downloads (Supabase storage)']]]];
    const tbl = rows => `<div class="tw"><table><tr><th></th>${days.map(d => `<th>${esc(d.slice(5))}</th>`).join('')}</tr>${rows.map(([m, l]) => `<tr><td>${esc(l)}</td>${days.map(d => `<td>${Math.round(get(d, m)).toLocaleString('en-IN')}</td>`).join('')}</tr>`).join('')}</table></div>`;
    const cfd = cf && cf.days ? cf.days.slice(0, 7) : []; const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
    $('#dp').innerHTML = (days.length ? '' : '<div class="card"><p class="note">No numbers yet. Players send them every 5 minutes while they play.</p></div>') + ROWS.map(([t, r]) => `<div class="card"><h3>${t}</h3>${tbl(r)}</div>`).join('') +
      `<div class="card"><h3>Game server (Cloudflare), counted on the server</h3>${cfd.length ? `<div class="tw"><table><tr><th>Day (India)</th><th>Messages in</th><th>Sent out</th><th>Most players at once</th><th>Biggest kinds</th></tr>${cfd.map(d => `<tr><td>${esc(d.day)}</td><td>${sum(d.in).toLocaleString('en-IN')}</td><td>${sum(d.out).toLocaleString('en-IN')}</td><td>${d.peak || 0}</td><td class="msg">${Object.entries(d.in || {}).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, v]) => `${esc(k)} ${v.toLocaleString('en-IN')}`).join(' · ')}</td></tr>`).join('')}</table></div><p class="note">Each message to the game server counts as a Cloudflare request. Positions (p) and voice pieces (vs) are the biggest.</p>` : '<p class="note">Deploy the new worker to see server counts.</p>'}</div>`; }
  async function dashAds() {
    const since = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10); await loadCfg();
    const { data, error } = await sb.from('ad_stats').select('day,sponsor,ad,views,clicks').gte('day', since);
    if (error) { $('#dp').innerHTML = `<p class="note bad">${esc(error.message)} · run supabase-update-9.sql</p>`; return; }
    const by = new Map(); for (const r of data) { const s0 = by.get(r.sponsor) || { v: 0, c: 0, ads: new Map() }; s0.v += +r.views; s0.c += +r.clicks; const a = s0.ads.get(r.ad) || { v: 0, c: 0 }; a.v += +r.views; a.c += +r.clicks; s0.ads.set(r.ad, a); by.set(r.sponsor, s0); }
    const ctr = (v, c) => v ? (c / v * 100).toFixed(1) + '%' : '–'; const today = new Date().toISOString().slice(0, 10);
    const running = (cfg.billboards || []).filter(b => b.advertiser && (!b.start || b.start <= today) && (!b.end || b.end >= today));
    const sec = (name, s0) => `<div class="card"><h3>${esc(name)} <span class="note" style="margin:0">· ${s0.v.toLocaleString('en-IN')} views · ${s0.c.toLocaleString('en-IN')} taps · ${ctr(s0.v, s0.c)}</span></h3><div class="tw"><table><tr><th>Ad</th><th>Views</th><th>Taps</th><th>Tap rate</th></tr>${[...s0.ads.entries()].sort((a, b) => b[1].v - a[1].v).map(([a, v]) => `<tr><td>${esc(a.replace(/\|/g, ' · '))}</td><td>${v.v.toLocaleString('en-IN')}</td><td>${v.c.toLocaleString('en-IN')}</td><td>${ctr(v.v, v.c)}</td></tr>`).join('')}</table></div></div>`;
    const spons = [...by.entries()].filter(([k]) => k !== 'India Bay' && k !== 'Sample').sort((a, b) => b[1].v - a[1].v);
    $('#dp').innerHTML = `<div class="card"><h2>Billboard ads · last 30 days</h2><p class="note">A view is a player passing within about 90 m of the board, facing it (counted once every 10 minutes per board). A click is a player tapping Directions or Visit on the ad (just opening it does not count).</p><div class="stats">${[...by.entries()].map(([k, v]) => `<div class="stat"><b>${v.v.toLocaleString('en-IN')}</b>${esc(k)} views</div>`).join('') || '<span class="note">No numbers yet.</span>'}</div></div>` +
      `<div class="card"><h3>Running now</h3>${running.length ? `<div class="tw"><table><tr><th>Sponsor</th><th>Ad</th><th>Cities</th><th>Dates</th><th>Views</th><th>Taps</th></tr>${running.map(b => { const s0 = by.get(b.advertiser); const a = s0 && s0.ads.get(String(b.text || '').slice(0, 120)); return `<tr><td>${esc(b.advertiser)}</td><td>${esc(String(b.text || '').replace(/\|/g, ' · '))}</td><td>${esc(b.zone || 'all')}</td><td>${esc(b.start || '…')} – ${esc(b.end || '…')}</td><td>${a ? a.v : 0}</td><td>${a ? a.c : 0}</td></tr>`; }).join('')}</table></div>` : '<p class="note">No collaborator ads are running. The game shows India Bay ads for real places instead (below).</p>'}</div>` +
      spons.map(([k, v]) => sec(k, v)).join('') + (by.get('India Bay') ? sec('India Bay ads (homes, vehicles, food, jobs, road safety)', by.get('India Bay')) : '') + (by.get('Sample') ? sec('Sample ads', by.get('Sample')) : ''); }
  start().catch(e => { gate.innerHTML = `<h2>Something went wrong</h2><p class="note bad">${esc(e.message || e)}</p>`; });
})();
</script>
